<!-- public/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Футбольная Алмазная Лига</title>
</head>
<body>
  <div id="root">
    <!-- Заглушка для гостей -->
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center;">
      <h2>Футбольная Алмазная Лига</h2>
      <p>Откройте приложение во ВКонтакте:</p>
      <a href="https://vk.com/app54429454" style="color: #0077ff; text-decoration: none;">Перейти в приложение</a>
    </div>
  </div>

  <!-- Проверка окружения -->
  <script>
    // Проверяем, что приложение запущено во ВКонтакте
    const isVK = window.location.search.includes('vk_app_id') || 
                 window.location.href.includes('vk.com/app');
    
    if (isVK) {
      // Загружаем основной JS только если во ВКонтакте
      const script = document.createElement('script');
      script.src = './static/js/main.js';
      script.defer = true;
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
